CONFIG_ZTEST=y

# TRACING_USER selects INSTRUMENT_THREAD_SWITCHING and provides __weak
# sys_trace_*_user() hooks that the test overrides. It is not part of
# TRACING_CORE, so no tracing backend or buffer is pulled in.
CONFIG_TRACING=y
CONFIG_TRACING_USER=y

# k_thread_cpu_pin() for SMP harness (timer IRQ + IRQ exit on same CPU as victim)
CONFIG_SCHED_CPU_MASK=y
